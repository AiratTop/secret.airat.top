# Tests and types on every pull request, and on main.
#
# Separate from deploy.yml on purpose: this one runs on untrusted contributions, so it is
# the workflow that must never see a Cloudflare credential. It has none, and needs none —
# the suite runs against a local D1 and `wrangler types` reads a local config file.
#
# It is also the check to make required once `main` is protected.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
